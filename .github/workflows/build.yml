name: Build Executables

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            asset-name: windows
          - os: macos-latest
            asset-name: macos
          - os: ubuntu-latest
            asset-name: linux

    env:
      VERSION: ${{ github.event.release.tag_name || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update -q &&
          sudo apt-get install -y
          libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      # macOS has no .icns in the repo - PyInstaller needs one for a native
      # app icon, so it's generated here from the existing source PNG with
      # sips/iconutil (both built into macOS) rather than committing a
      # second, easy-to-forget-to-update copy of the logo.
      - name: Generate macOS icon
        if: runner.os == 'macOS'
        run: |
          mkdir icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size src/labell3r/res/labell3r_logo.png --out icon.iconset/icon_${size}x${size}.png
            double=$((size * 2))
            sips -z $double $double src/labell3r/res/labell3r_logo.png --out icon.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns icon.iconset -o labell3r_logo.icns

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller
          --add-data "src/labell3r/res/*;labell3r/res"
          --add-data "LICENSE;."
          --add-data "licenses/*;licenses"
          --onedir
          --name "Labell3R"
          --icon "src/labell3r/res/labell3r_logo.ico"
          --noconsole
          --noconfirm
          src/labell3r/main.py

      - name: Build executable (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller
          --add-data "src/labell3r/res/*:labell3r/res"
          --add-data "LICENSE:."
          --add-data "licenses/*:licenses"
          --onedir
          --name "Labell3R"
          --icon "labell3r_logo.icns"
          --noconsole
          --noconfirm
          src/labell3r/main.py

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: >
          pyinstaller
          --add-data "src/labell3r/res/*:labell3r/res"
          --add-data "LICENSE:."
          --add-data "licenses/*:licenses"
          --onedir
          --name "Labell3R"
          --noconsole
          --noconfirm
          src/labell3r/main.py

      - name: Zip build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Labell3R -DestinationPath "Labell3R-$env:VERSION-$env:ASSET_NAME.zip"
        env:
          ASSET_NAME: ${{ matrix.asset-name }}

      - name: Zip build (macOS/Linux)
        if: runner.os != 'Windows'
        working-directory: dist
        run: zip -r "../Labell3R-$VERSION-${{ matrix.asset-name }}.zip" Labell3R

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Labell3R-${{ matrix.asset-name }}
          path: Labell3R-*.zip

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" Labell3R-*.zip --clobber
